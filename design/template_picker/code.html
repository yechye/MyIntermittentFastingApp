<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(234, 231, 224, 0.5);
        }
        .glow-active {
            box-shadow: 0 10px 20px -5px rgba(127, 176, 105, 0.2);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fcf8fb;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface">
<!-- Header (Suppressed Bottom Nav as per Destination Rule for Task-Focused screens) -->
<header class="fixed top-0 w-full z-50 bg-surface/70 backdrop-blur-xl border-b border-glass-border">
<div class="flex justify-between items-center px-margin-page h-16 w-full max-w-md mx-auto">
<button class="w-10 h-10 flex items-center justify-start hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Select Template</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="pt-24 pb-12 px-margin-page max-w-md mx-auto">
<div class="space-y-stack-md">
<!-- Beginner: 16:8 -->
<button class="w-full text-left glass-card rounded-xl p-stack-md flex items-center justify-between glow-active hover:opacity-90 active:scale-[0.98] transition-all">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md text-primary">16:8 Beginner</span>
<span class="px-2 py-0.5 bg-brand-sage/10 text-brand-sage font-label-caps text-label-caps rounded-full flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-brand-sage animate-pulse"></span>
                            Recommended
                        </span>
</div>
<p class="font-body-md text-on-surface-variant">16 hours fasting, 8 hours eating window.</p>
</div>
<span class="material-symbols-outlined text-brand-sage" style="font-variation-settings: 'FILL' 1;">chevron_right</span>
</button>
<!-- Gentle: 14:10 -->
<button class="w-full text-left glass-card rounded-xl p-stack-md flex items-center justify-between hover:opacity-90 active:scale-[0.98] transition-all">
<div class="flex flex-col gap-1">
<span class="font-headline-md text-headline-md text-primary">14:10 Gentle</span>
<p class="font-body-md text-on-surface-variant">A softer introduction to intermittent fasting.</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Advanced: 18:6 -->
<button class="w-full text-left glass-card rounded-xl p-stack-md flex items-center justify-between hover:opacity-90 active:scale-[0.98] transition-all">
<div class="flex flex-col gap-1">
<span class="font-headline-md text-headline-md text-primary">18:6 Advanced</span>
<p class="font-body-md text-on-surface-variant">Shortened eating window for metabolic efficiency.</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Intensive: 20:4 -->
<button class="w-full text-left glass-card rounded-xl p-stack-md flex items-center justify-between hover:opacity-90 active:scale-[0.98] transition-all">
<div class="flex flex-col gap-1">
<span class="font-headline-md text-headline-md text-primary">20:4 Intensive</span>
<p class="font-body-md text-on-surface-variant">The Warrior Diet style. Highly focused protocol.</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Weekly: 5:2 -->
<button class="w-full text-left glass-card rounded-xl p-stack-md flex items-center justify-between hover:opacity-90 active:scale-[0.98] transition-all">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md text-primary">5:2 Weekly</span>
<span class="px-2 py-0.5 bg-tertiary-container/10 text-on-tertiary-container font-label-caps text-label-caps rounded-full">
                            Advanced
                        </span>
</div>
<p class="font-body-md text-on-surface-variant">Eat normally for 5 days, fast for 2 non-consecutive days.</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Alternate-Day -->
<button class="w-full text-left glass-card rounded-xl p-stack-md flex items-center justify-between hover:opacity-90 active:scale-[0.98] transition-all">
<div class="flex flex-col gap-1">
<span class="font-headline-md text-headline-md text-primary">Alternate-Day</span>
<p class="font-body-md text-on-surface-variant">Fasting every other day. Intense discipline required.</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Custom Plan -->
<div class="pt-stack-lg">
<button class="w-full text-center bg-brand-sage py-4 rounded-full text-white font-headline-md text-headline-md shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add_circle</span>
                    Custom Plan
                </button>
</div>
</div>
<!-- Pro Tip Card -->
<div class="mt-stack-lg glass-card rounded-xl p-stack-md relative overflow-hidden">
<div class="relative z-10 flex gap-4">
<div class="w-12 h-12 rounded-full bg-brand-sage/20 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-brand-sage" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-primary mb-1">Choosing your path</h3>
<p class="font-body-md text-on-surface-variant">Start with 16:8 if you're new. It’s the most sustainable way to balance hunger hormones and daily life.</p>
</div>
</div>
<!-- Subtle aesthetic background blob -->
<div class="absolute -right-10 -bottom-10 w-32 h-32 bg-brand-sage/5 rounded-full blur-3xl"></div>
</div>
<!-- Image Illustration -->
<div class="mt-stack-lg rounded-2xl overflow-hidden glass-card h-48 relative">
<img alt="Healthy lifestyle" class="w-full h-full object-cover opacity-80" data-alt="A tranquil and minimalist scene showing a morning sunrise over a peaceful garden terrace. Soft, warm sunlight filters through sage green leaves, illuminating a clean wooden table with a glass of crystal clear water and a single fresh leaf. The atmosphere is serene, high-key, and modern, reflecting a sense of vitality, health, and calm discipline typical of a high-end wellness brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3qRUsG5W89DikJ4ThbVMUuSNxRaFHXzUg-MtMC0FrWV5VBSAeRWXRfAbPqd5lns1dz4hxAyrSlxumPeHnvu-37JUljULVQtwrwRgeccRQ8JpmjStJJJ-JzNYDPJoIV0FLlnaqBElMKiukQ8GejLKQS8bT1mbnW4Fhrj2oemKNF73f8IAiBR67ho-v7-VxVUY6qIym3r5olOBFJNqDK-vZuSFIJVmwfwBetv9MNAXmcWFDLDwbnkSrP4lrUCmZbK1INnxgFDn7nrg"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-main/80 to-transparent flex items-end p-margin-page">
<p class="font-label-caps text-label-caps text-primary tracking-widest">EMBRACE THE CLARITY</p>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for item selection
        document.querySelectorAll('button.glass-card').forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active styling from all
                document.querySelectorAll('button.glass-card').forEach(b => {
                    b.classList.remove('glow-active', 'border-brand-sage/50');
                    const icon = b.querySelector('.material-symbols-outlined:last-child');
                    if(icon) {
                        icon.style.fontVariationSettings = "'FILL' 0";
                        icon.classList.remove('text-brand-sage');
                        icon.classList.add('text-on-surface-variant');
                    }
                });
                
                // Add to clicked
                btn.classList.add('glow-active', 'border-brand-sage/50');
                const icon = btn.querySelector('.material-symbols-outlined:last-child');
                if(icon) {
                    icon.style.fontVariationSettings = "'FILL' 1";
                    icon.classList.remove('text-on-surface-variant');
                    icon.classList.add('text-brand-sage');
                }
            });
        });
    </script>
</body></html>
